name: Publicar no npm

# Dispara com uma tag de versão (ex.: v1.0.0) num commit que já está na main, com a versão dos três pacotes. Dois jobs:
# o primeiro instala, testa e empacota sem nenhuma credencial; o segundo só publica os pacotes prontos, no environment
# "npm" (com revisores), e é o único com id-token. Fica desligado até a variável PUBLICAR_NO_NPM valer "sim":
# o passo a passo está em docs/publicar.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  empacotar:
    name: Conferir, testar e empacotar
    if: vars.PUBLICAR_NO_NPM == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: O commit da tag está na main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O commit da tag $GITHUB_REF_NAME não está na main: publique só o que já foi revisado."
            exit 1
          fi
      - name: A tag é a versão dos pacotes
        run: |
          versao="${GITHUB_REF_NAME#v}"
          for pacote in types rest sdk; do
            atual=$(node -p "require('./packages/$pacote/package.json').version")
            if [ "$atual" != "$versao" ]; then
              echo "::error::@lerolero/$pacote está em $atual e a tag é $GITHUB_REF_NAME."
              exit 1
            fi
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tipos
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:consumo
      - name: Empacotar
        run: |
          mkdir pacotes
          for pacote in types rest sdk; do
            (cd "packages/$pacote" && pnpm pack --pack-destination ../../pacotes)
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacotes
          path: pacotes/*.tgz
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar @lerolero/types, @lerolero/rest e @lerolero/sdk
    needs: empacotar
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacotes
          path: pacotes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # O trusted publishing (OIDC, sem token) pede o npm 11.5.1 ou mais novo. Os tarballs já vêm prontos do job
      # anterior: aqui nada é instalado nem roda script de pacote, só o npm publica.
      - run: npm install --global npm@11.6.2
      - name: Publicar
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pacote in types rest sdk; do
            npm publish pacotes/lerolero-$pacote-*.tgz --access public --provenance --ignore-scripts
          done
