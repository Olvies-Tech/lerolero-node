name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes, build e pacotes (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tipos
      - run: pnpm test
      - run: pnpm build
      # attw, TypeScript (nodenext e bundler), import e require contra os tarballs, que ficam em pacotes/.
      - run: pnpm test:consumo --guardar pacotes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacotes
          path: pacotes/*.tgz
          if-no-files-found: error
          retention-days: 7

  # As ferramentas de dev pedem Node 20 ou mais novo, mas o SDK promete Node 18: aqui só os pacotes prontos entram, numa
  # pasta vazia, e rodam import, require e o vetor do webhook, sem pnpm nem dependência de dev.
  execucao:
    name: Execução em Node ${{ matrix.node }} (import, require e webhook)
    needs: qualidade
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacotes
          path: pacotes
      - run: node scripts/conferir-consumo.mjs --so-execucao pacotes
